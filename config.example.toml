bind = "0.0.0.0:3260"
# Host (or host:port) returned in SendTargets for the shared portal.
# Needed when clients cannot reach the listen address (Docker/NAT).
# advertise = "127.0.0.1"
#
# Multi-instance MPIO: list every client-reachable portal (this process still
# binds only `bind`). Discovery returns all of them for each IQN.
# portals = ["10.0.0.1:3260", "10.0.0.2:3260"]
# instance = "path-a"   # optional label for logs

[s3]
bucket = "iscsi"
region = "us-east-1"
endpoint = "http://127.0.0.1:9000"
force_path_style = true
# Optional; otherwise use AWS_* env / default credential chain:
# access_key_id = "minioadmin"
# secret_access_key = "minioadmin"

[cache]
max_bytes = "256MiB"
# For multi-instance MPIO set to 0 so peers cannot return stale chunks:
# max_bytes = 0

[metrics]
# Prometheus scrape endpoint (GET /metrics). Disable with enabled = false.
enabled = true
bind = "0.0.0.0:9090"

[[volumes]]
name = "disk0"
iqn = "iqn.2026-09.local.iscsi-s3:disk0"
prefix = "disks/disk0"
capacity = "10GiB"
# block_size = 512
# chunk_size = "4MiB"

[[volumes]]
name = "disk1"
iqn = "iqn.2026-09.local.iscsi-s3:disk1"
prefix = "disks/disk1"
capacity = "50GiB"
