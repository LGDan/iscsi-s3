bind = "0.0.0.0:3260"
# Host (or host:port) returned in SendTargets for the shared portal.
# Needed when clients cannot reach the listen address (Docker/NAT).
# advertise = "127.0.0.1"
#
# Multi-instance MPIO: list every client-reachable portal (this process still
# binds only `bind`). Discovery returns all of them for each IQN.
# portals = ["10.0.0.1:3260", "10.0.0.2:3260"]
# instance = "path-a"   # optional label for logs
#
# Single-process dual-NIC (keep cache): bind all interfaces and advertise both IPs
# — see config.mpio-single.toml and docs/users/mpio.md Setup A.
# bind = "0.0.0.0:3260"
# portals = ["10.0.0.1:3260", "10.0.0.2:3260"]

# Optional CHAP (omit = AuthMethod=None). Prefer env for secrets in production:
#   ISCSI_S3_AUTH__USERNAME / ISCSI_S3_AUTH__SECRET
# [auth]
# username = "iscsiuser"
# secret = "change-me"
# mutual_username = "targetid"   # enables mutual CHAP when both mutual_* set
# mutual_secret = "change-me-too"
# allowed_initiators = ["iqn.1993-08.org.debian:01:example"]

[s3]
bucket = "iscsi"
region = "us-east-1"
endpoint = "http://127.0.0.1:9000"
force_path_style = true
# Optional; otherwise use AWS_* env / default credential chain:
# access_key_id = "minioadmin"
# secret_access_key = "minioadmin"

[cache]
max_bytes = "256MiB"
# For multi-instance MPIO set to 0 so peers cannot return stale chunks:
# max_bytes = 0
# Or live: iscsi-s3-ctl cache disable  (see docs/users/admin-ctl.md)

[metrics]
# Prometheus scrape endpoint (GET /metrics). Disable with enabled = false.
enabled = true
bind = "0.0.0.0:9090"

# Local Unix socket for iscsi-s3-ctl (stats / cache / reload).
# [admin]
# enabled = true
# socket = "/tmp/iscsi-s3/admin.sock"

[[volumes]]
name = "disk0"
iqn = "iqn.2026-09.local.iscsi-s3:disk0"
prefix = "disks/disk0"
capacity = "10GiB"
# block_size = 512
# chunk_size = "4MiB"
# compression = "none"   # or "lz4" | "zstd" | "deflate" (locked in meta.json)

[[volumes]]
name = "disk1"
iqn = "iqn.2026-09.local.iscsi-s3:disk1"
prefix = "disks/disk1"
capacity = "50GiB"
