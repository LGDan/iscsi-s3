# Path B instance for dual-portal MPIO lab (see docker-compose.mpio.yml).
bind = "0.0.0.0:3260"
instance = "b"
portals = ["127.0.0.1:3260", "127.0.0.1:3261"]

[s3]
bucket = "iscsi"
region = "us-east-1"
endpoint = "http://minio:9000"
force_path_style = true
access_key_id = "minioadmin"
secret_access_key = "minioadmin"

[cache]
max_bytes = 0

[metrics]
enabled = true
bind = "0.0.0.0:9090"

[[volumes]]
name = "disk0"
iqn = "iqn.2026-09.local.iscsi-s3:disk0"
prefix = "disks/disk0"
capacity = "64MiB"
chunk_size = "64KiB"
