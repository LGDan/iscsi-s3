services:
  rclone:
    image: rclone/rclone:latest
    # Default serve bind is 127.0.0.1:8080; listen on all interfaces for Compose.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /ext-hd/iscsi
        exec rclone serve s3 /ext-hd \
          --addr :9000 \
          --auth-key minioadmin,minioadmin \
          --dir-cache-time 1s
    ports:
      - "9000:9000"
    volumes:
      - /Volumes/T5/iscsi:/ext-hd
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q HTTP"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  iscsi-s3:
    build: .
    depends_on:
      rclone:
        condition: service_healthy
    ports:
      - "3260:3260"
      # Host 9091 avoids clashing with Prometheus on 9090
      - "9091:9090"
    volumes:
      #- ./config.docker.toml:/etc/iscsi-s3/config.toml:ro
      - ./config.integration.toml:/etc/iscsi-s3/config.toml:ro
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Default: warnings and errors only. For login/SCSI traces:
      RUST_LOG: info,iscsi_s3=info,iscsi_target=info
      #RUST_LOG: warn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - iscsi-s3
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # One-shot smoke against the shared portal (default IQN on :3260)
  # smoke:
  #   build: .
  #   entrypoint: ["smoke_client"]
  #   command: ["iscsi-s3:3260"]
  #   depends_on:
  #     - iscsi-s3
  #   profiles:
  #     - test
  #   restart: "no"

volumes:
  prometheus-data:
  grafana-data:
