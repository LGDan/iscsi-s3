[package]
name = "iscsi-s3"
version = "0.1.0"
edition = "2021"
description = "Userspace iSCSI target backed by S3 chunk objects"
license = "MIT OR Apache-2.0"

[lib]
name = "iscsi_s3"
path = "src/lib.rs"

[[bin]]
name = "iscsi-s3"
path = "src/main.rs"

[[bin]]
name = "iscsi-s3-ctl"
path = "src/bin/iscsi-s3-ctl.rs"

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
bytes = "1"
bytesize = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
# Vendored: adds advertise_addr for SendTargets behind Docker/NAT
iscsi-target = { path = "vendor/iscsi-target" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
prometheus = "0.13"
tiny_http = "0.12"
lz4_flex = "0.11"
zstd = "0.13"
flate2 = "1"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
