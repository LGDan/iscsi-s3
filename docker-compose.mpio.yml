# Dual-instance Path-A MPIO lab (two portals, shared S3, rolling restart).
# Cache is off. For dual-NIC + warm cache in one process, see config.mpio-single.toml
# and docs/users/mpio.md Setup A instead.
#
#   docker compose -f docker-compose.mpio.yml up -d --build
#
# Host portals: 127.0.0.1:3260 (instance a) and 127.0.0.1:3261 (instance b).
# Metrics: :9091 (a), :9092 (b). MinIO :9000 / console :9001.
#
# Production dual-NIC: run one process per NIC IP on :3260 and set
# portals = ["nic-a-ip:3260", "nic-b-ip:3260"] identically on both.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/iscsi || true;
      mc anonymous set none local/iscsi;
      echo bucket-ready;
      "

  iscsi-s3-a:
    build: .
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "3260:3260"
      - "9091:9090"
    volumes:
      - ./config.mpio-a.toml:/etc/iscsi-s3/config.toml:ro
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  iscsi-s3-b:
    build: .
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "3261:3260"
      - "9092:9090"
    volumes:
      - ./config.mpio-b.toml:/etc/iscsi-s3/config.toml:ro
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - iscsi-s3-a
      - iscsi-s3-b
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.mpio.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: unless-stopped

volumes:
  minio-data:
  prometheus-data:
