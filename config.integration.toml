# Docker Compose / container defaults (rclone serve s3)
bind = "0.0.0.0:3260"
# Address iscsiadm stores from SendTargets (not the container eth0 IP).
advertise = "192.168.88.15"

[s3]
bucket = "iscsi"
region = "us-east-1"
endpoint = "http://rclone:9000"
force_path_style = true
access_key_id = "minioadmin"
secret_access_key = "minioadmin"

[cache]
max_bytes = "256MiB"

[metrics]
enabled = true
bind = "0.0.0.0:9090"

[[volumes]]
name = "disk0"
iqn = "iqn.2026-09.local.iscsi-s3:disk0"
prefix = "disks/disk0"
capacity = "64GiB"
chunk_size = "8MiB"
storage = "cow"
write_cache = { mode = "memory", max_bytes = "512MiB" }

[[volumes]]
name = "disk1"
iqn = "iqn.2026-09.local.iscsi-s3:disk1"
prefix = "disks/disk1"
capacity = "16GiB"
chunk_size = "256KiB"